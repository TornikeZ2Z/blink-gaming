<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1322">
<title>Plane Crash · Brainer</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <canvas id="cv" aria-label="Your Brainer's flight"></canvas>
    <header class="hud">
      <div class="brand"><img src="assets/logo-white.png" alt="Brainer" class="logo"><span class="t1">Plane Crash</span></div>
      <div class="wallet"><span id="balance">1,000.00</span><small>FUN</small><button type="button" id="refill" title="Reset demo balance to 1,000 FUN">Reset</button></div>
    </header>
    <div class="pilot" id="pilot">
      <div class="ava"><img id="pilotImg" src="assets/brainer-1.png" alt=""><span class="lvnum" id="lvnum">1</span><span class="bubble" id="bubble" hidden></span></div>
      <div class="pinfo">
        <span class="plv" id="plv">Brain level 1</span>
        <span class="bar" aria-hidden="true"><i id="pbar"></i></span>
        <span class="pnote" id="pnote"></span>
      </div>
    </div>
    <div class="readout" id="readout">
      <span class="label" id="label"></span>
      <span class="mult" id="mult"></span>
      <span class="sub" id="sub" hidden></span>
    </div>
    <div class="levelup" id="levelup" hidden><img id="luImg" alt=""><b id="luTitle"></b><span id="luSub"></span></div>
    <div class="ladder" id="ladder" aria-label="Multiplier after each safe path"></div>
  </section>

  <section class="controls" aria-label="Game controls">
    <div class="setup" id="setup">
      <div class="field">
        <label for="amt">Bet</label>
        <div class="bet-row">
          <button type="button" class="step" id="dec" aria-label="Lower bet">−</button>
          <input id="amt" type="number" inputmode="decimal" step="0.1">
          <button type="button" class="step" id="inc" aria-label="Raise bet">+</button>
        </div>
        <div class="chips" id="chips">
          <button type="button" data-chip="min">Min</button><button type="button" data-chip="half">½</button><button type="button" data-chip="dbl">2×</button><button type="button" data-chip="max">Max</button>
        </div>
      </div>
      <div class="field">
        <span class="flabel">Level</span>
        <div class="lv" id="levels"></div>
      </div>
      <button type="button" class="big play" id="play"><span class="l1">Play</span><span class="l2" id="playSub"></span></button>
    </div>
    <div class="flight" id="flight" hidden>
      <div class="paths" id="paths"></div>
      <button type="button" class="big jump" id="jump">
        <span class="l1"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 11a9 7 0 0 1 18 0z" fill="#0a1322"/><path d="M3 11l9 9 9-9M9 11l3 9 3-9" fill="none" stroke="#0a1322" stroke-width="1.6"/></svg>Jump</span>
        <span class="l2" id="jumpSub"></span>
      </button>
    </div>
  </section>
  <p class="foot">Demo with FUN credits · Keys: 1–5 pick a path · Space jumps or plays</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="game.js"></script>
</body>
</html>
